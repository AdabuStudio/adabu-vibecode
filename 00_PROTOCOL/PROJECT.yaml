protocol:
  name: adabu-vibecode
  display_name: "Adabù VibeCode Protocol"
  version: 7

project:
  name: ""
  slug: ""
  # lab | client | internal | personal | infra | unknown
  type: unknown
  # repo   → progetto versionato, Git è la verità tecnica
  # infra  → gestione macchine/servizi: la verità è lo stato reale della macchina
  # local  → progetto senza Git: STATE.md e HANDOFF.md sono l'UNICA memoria
  runtime: repo

repository:
  current_branch: ""
  main_branch: ""

agents:
  primary: null
  worked_so_far: []
  constraints: []

# >>> adabu-vibecode:ai_routing >>>
# ─────────────────────────────────────────────────────────────────────
# AI ROUTING — quale tier di modello per quale tipo di lavoro.
# Regole e criteri stanno in MODEL_ROUTING.md, che parla solo di tier.
# Questi sono i default del team: ogni macchina può sovrascriverli per il
# proprio harness con 00_PROTOCOL/tiers.sh, senza toccare questo file.
#
# Questo blocco è l'UNICO posto del protocollo dove compaiono nomi di
# modelli. Quando i modelli cambiano — e cambiano ogni pochi mesi — si
# aggiornano qui e il resto del protocollo resta valido.
#
# Verifica che i nomi corrispondano a ciò a cui l'account ha davvero
# accesso: un modello annunciato non è un modello disponibile.
# ─────────────────────────────────────────────────────────────────────
ai_routing:
  policy: cost-aware
  default_tier: base

  tiers:
    economic:        # SIMPLE: ripetitivo, reversibile, a rischio nullo
      claude: haiku
      openai: luna
      # altri provider (locale, GLM, Kimi, Qwen, DeepSeek, Gemini): aggiungere qui
    base:            # STANDARD: il default, 60-80% del lavoro
      claude: sonnet
      openai: terra
    premium:         # COMPLEX/CRITICAL: pensare, decidere, sbloccare, verificare
      claude: opus
      openai: sol

  escalation:
    max_base_failures: 2       # due tentativi falliti → STOP, non un terzo tentativo
    on_low_confidence: true
    on_high_risk: true
    on_architecture: true

  deescalation:
    enabled: true
    after_plan: true
    after_root_cause: true

  # Vincoli di questo progetto. Vincono sulla classificazione del task.
  overrides:
    forbid_tiers: []           # es. [premium] per un progetto a budget chiuso
    pin_provider: null         # es. claude, se il progetto deve restare su un solo fornitore
# <<< adabu-vibecode:ai_routing <<<

# ─────────────────────────────────────────────────────────────────────
# SYNC — sempre e solo in uscita: repo → esterno. Mai il contrario.
#
# bound: false  → l'agente NON sincronizza e NON indovina la destinazione.
#                 Chiede a Federico URL e cadenza, poi compila qui.
#
# cadence:
#   always       → ad ogni handoff di fine sessione
#   on_command   → solo quando Federico dice "sincronizza"
#   on_milestone → solo su cambiamento sostanziale (definizione in RULES.md)
#   never        → mai
# ─────────────────────────────────────────────────────────────────────
sync:
  direction: repo_to_external_only

  clickup:
    bound: false
    url: null            # incollato da Federico
    # Uno solo dei due, dedotto dall'URL:
    #   .../t/<id>        → task_id  (progetto cliente: un task nell'area del cliente)
    #   .../li/<id>       → list_id  (lab/prodotto: lista dedicata in 05-LAB)
    task_id: null
    list_id: null
    cadence: on_command
    payload: [state_summary, tasks_now_next]
    last_synced: null

  client_brain:
    bound: false
    url: null            # documento 00_[CLIENTE]_AI
    doc_id: null
    read_only: true      # SOLA LETTURA da una sessione di sviluppo
    cadence: never

  # Chiave "mente_ai" mantenuta per compatibilità: vale anche per Mind Exsafe.
  mente_ai:
    bound: false
    # mente-ai    → memoria personale di Federico (mcp.mente.zusho.it).
    #               Si usa SEMPRE se l'agente ha il tool MENTE disponibile;
    #               chi non ce l'ha (il team) salta in silenzio.
    # mind-exsafe → SOLO su richiesta esplicita. Mai proposta.
    instance: null
    project: null
    # legacy: lo scope lo assegna il routing di MENTE dal project. Lasciare null.
    chapter: null
    cadence: on_milestone
    payload: [decisions]
    last_synced: null
